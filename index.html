<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 제품 영상 생성기</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14161f;--mu:#6b7080;--pr:#4f46e5;--bd:#e3e5ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f7;--mu:#9aa0b4;--bd:#2c3040}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:960px;margin:0 auto;padding:24px 16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
.drop{border:2px dashed var(--bd);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--mu);font-size:13px}
.drop img{max-width:100%;max-height:200px}
select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#out{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;color:var(--mu)}
video{max-width:100%;max-height:520px;border-radius:10px}
a.dl{margin-top:10px;color:var(--pr);font-weight:600}
</style></head><body><main>
<h1>🎬 AI 제품 영상 생성기</h1>
<section class="card">
  <label>① 제품 이미지 (필수)</label>
  <div class="drop" id="d1">클릭해서 업로드</div><input type="file" id="f1" accept="image/*" hidden>
  <label>② 모델(사람) 이미지 (선택 · 없으면 AI가 모델 생성)</label>
  <div class="drop" id="d2">클릭해서 업로드</div><input type="file" id="f2" accept="image/*" hidden>
  <label>③ 동작</label>
  <select id="act">
    <option value="holds the product with both hands, gently touches and strokes its surface while looking at the camera">제품을 두 손으로 만지며 보여주기</option>
    <option value="picks up the product, rotates it to show details, and smiles at the camera">제품을 들어 돌려 보여주기</option>
    <option value="naturally uses the product in daily life, touching and handling it">제품을 자연스럽게 사용하기</option>
    <option value="leans on the product, slowly runs a hand over it, then looks at the camera">제품에 기대어 쓰다듬기</option>
  </select>
  <label>④ 추가 요청 (선택)</label>
  <textarea id="extra" placeholder="예: 밝은 스튜디오 배경, 한국인 여성 모델, 자막 없음"></textarea>
  <label>비율</label>
  <select id="ar"><option value="9:16">9:16 (릴스·쇼츠)</option><option value="16:9">16:9 (가로)</option></select>
  <button id="go">영상 생성 (약 1~3분)</button>
</section>
<section class="card" id="out">결과가 여기에 표시됩니다.</section>
</main>
<script>
const imgs={1:null,2:null};
function setup(n){
  const d=document.getElementById('d'+n),f=document.getElementById('f'+n);
  d.onclick=()=>f.click();
  f.onchange=()=>{const file=f.files[0];if(!file)return;
    const im=new Image();im.onload=()=>{
      const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL('image/jpeg',.85);
      imgs[n]={data:url.split(',')[1],mime:'image/jpeg'};
      d.innerHTML='';const p=new Image();p.src=url;d.appendChild(p);
    };im.src=URL.createObjectURL(file);};
}
setup(1);setup(2);
const out=document.getElementById('out'),btn=document.getElementById('go');
btn.onclick=async()=>{
  if(!imgs[1])return alert('제품 이미지를 올려주세요.');
  btn.disabled=true;out.textContent='생성 요청 중…';
  const hasP=!!imgs[2];
  const who=hasP?'The model from <IMAGE_REF_1>':'A photogenic Korean model';
  const prompt=`Single continuous shot, no scene cuts. ${who} ${document.getElementById('act').value}. The product must look exactly like <IMAGE_REF_0> (same package, logo and label). Smooth natural motion, professional lighting. ${document.getElementById('extra').value} No dialogue, calm background music.`;
  const jobId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));
  try{
    const r=await fetch('/.netlify/functions/generate-background',{method:'POST',body:JSON.stringify({jobId,prompt,images:[imgs[1],imgs[2]].filter(Boolean),aspect:document.getElementById('ar').value})});
    if(!r.ok&&r.status!==202)throw new Error('생성 요청 실패 ('+r.status+')');
    let t=0;
    while(true){
      out.textContent=`AI가 영상을 만드는 중… (${t}초 경과)`;
      await new Promise(r=>setTimeout(r,6000));t+=6;
      const s=await (await fetch('/.netlify/functions/status?id='+jobId)).json();
      if(s.status==='failed')throw new Error(s.error||'생성 실패');
      if(s.status==='done'){
        const u='/.netlify/functions/video?id='+jobId;
        out.innerHTML=`<video src="${u}" controls autoplay loop playsinline></video><a class="dl" href="${u}" download="product-video.mp4">⬇ MP4 다운로드</a>`;
        break;}
      if(t>600)throw new Error('시간 초과');
    }
  }catch(e){out.textContent='실패: '+e.message}
  btn.disabled=false;
};
</script></body></html>
